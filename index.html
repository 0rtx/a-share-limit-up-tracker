<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A股涨停跟踪</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="brand">
      <div class="logo">涨</div>
      <div class="brand-txt">
        <h1>A股涨停跟踪</h1>
        <p>涨停 · 连板 · 板块强度</p>
      </div>
    </div>

    <div class="hdr-right">
      <div class="date-nav">
        <button id="prevDay" class="icon-btn" title="上一交易日">‹</button>
        <input type="date" id="dateInput">
        <button id="nextDay" class="icon-btn" title="下一交易日">›</button>
        <button id="todayBtn" class="ghost-btn">今天</button>
      </div>
      <button id="refreshBtn" class="primary-btn">刷新</button>
      <div class="status">
        <span id="liveDot" class="dot"></span>
        <span id="statusText">加载中…</span>
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <section class="stats" id="stats"></section>

  <nav class="views" id="viewTabs">
    <button class="on" data-view="relay">接力复盘</button>
    <button data-view="sector">板块强度</button>
    <button data-view="list">涨停明细</button>
    <button data-view="strategy">策略选股</button>
  </nav>

  <!-- 接力复盘 -->
  <section class="panel view" id="viewRelay">
    <div class="rules">
      <span class="rules-label">排序规则</span>
      <div class="tabs rule-tabs" id="ruleTabs">
        <button class="on" data-rule="hot">今日行情</button>
        <button data-rule="chg">涨幅</button>
        <button data-rule="first">首封</button>
        <button data-rule="open">未封</button>
        <button data-rule="order">封单</button>
        <button data-rule="amount">成交额</button>
        <button data-rule="cap">实际流通</button>
        <button data-rule="turnover">实际换手</button>
      </div>
      <button class="promote" id="promoteBtn" aria-pressed="false" title="只看晋级成功的股票"><span class="pt"></span>晋级</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="focus-bar hidden" id="focusBar"></div>
    <div class="ladder" id="ladder"></div>
  </section>

  <!-- 板块强度 -->
  <section class="panel view hidden" id="viewSector">
    <div class="sector-head">
      <div class="tabs" id="sectorMode">
        <button class="on" data-m="chg">板块涨幅</button>
        <button data-m="strength">板块强度</button>
        <button data-m="zt">涨停家数</button>
      </div>
      <div class="sector-hint" id="sectorHint">勾选左侧板块对比分时走势</div>
    </div>
    <div class="sector-body">
      <aside class="sector-list" id="sectorList"></aside>
      <div class="sector-chart">
        <canvas id="sectorCanvas"></canvas>
        <div class="tip" id="sectorTip"></div>
      </div>
    </div>
  </section>

  <!-- 涨停明细 -->
  <section class="panel view hidden" id="viewList">
    <div class="list-head">
      <div class="tabs" id="tabTabs">
        <button class="on" data-tab="zt">涨停 <span id="cntZt">0</span></button>
        <button data-tab="zb">炸板 <span id="cntZb">0</span></button>
        <button data-tab="dt">跌停 <span id="cntDt">0</span></button>
      </div>
      <div class="list-tools">
        <input type="search" id="search" placeholder="搜索代码 / 名称 / 板块">
        <select id="levelFilter">
          <option value="">全部连板</option>
          <option value="1">首板</option>
          <option value="2">2 板</option>
          <option value="3">3 板</option>
          <option value="4">4 板</option>
          <option value="5">5 板</option>
          <option value="6">6 板及以上</option>
        </select>
        <button id="exportBtn" class="ghost-btn">导出 CSV</button>
      </div>
    </div>
    <div class="table-wrap">
      <table id="stockTable">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="table-foot" id="tableFoot"></div>
  </section>

  <!-- 策略选股 -->
  <section class="panel view hidden" id="viewStrategy">
    <div class="strategy-note">策略选股器 —— 收集市场上流传较广的短线玩法，在本站数据上落地为可解释的规则。命中结果仅供参考，不构成任何投资建议。</div>
    <div class="strategy-grid" id="strategyGrid"></div>
  </section>

  <footer class="foot">
    数据：同花顺涨停池 · 东方财富行情 · 腾讯分时　|　仅供复盘学习，不构成投资建议
  </footer>
</div>

<div id="loading"><div class="spinner"></div></div>
<div id="toast"></div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div id="modalTitle"></div>
      <button class="icon-btn" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="chart-head">
        <div class="chart-tabs" id="periodTabs"></div>
        <div class="chart-info" id="chartInfo"></div>
      </div>
      <canvas id="stockChart"></canvas>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
